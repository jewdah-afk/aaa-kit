<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Effects Hierarchy</title>
<style>
/* The page is the hierarchy: six sections, loudest first (HIERARCHY.md §2). Each section states its
   budget, then holds the effects that live in that tier. Dark on purpose: the effects carry the colour. */
:root { --ink:#0b0a10; --bench:#14121c; --raise:#1b1826; --edge:#2a2538; --fg:#ece8f4; --muted:#9d95b3;
  --t1:#ff3d7f; --t2:#ffb02e; --t3:#ffd24a; --t4:#6fd6ff; --t5:#b25cff; --t6:#7fd1a3; color-scheme: dark; }
* { box-sizing: border-box; }
html { background: var(--ink); scroll-padding-top: 64px; }
body { margin: 0; background: var(--ink); color: var(--fg); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px 16px 80px; }
.wrap { max-width: 1680px; margin: 0 auto; display: grid; gap: 44px; }
header h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.6rem); line-height: 1; letter-spacing: -.02em; }
header p { margin: 10px 0 0; color: var(--muted); max-width: 78ch; }
.ladder { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 18px; }
.ladder a { display: grid; gap: 4px; padding: 10px; background: var(--bench); border: 1px solid var(--edge); border-radius: 8px; color: var(--fg); text-decoration: none; min-width: 0; }
.ladder a:hover { border-color: var(--c); }
.ladder b { font: 700 1.4rem/1 ui-monospace, monospace; color: var(--c); }
.ladder span { font-size: .78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meter { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--c) var(--w), var(--edge) var(--w)); }
.bar { position: sticky; top: 0; z-index: 5; background: var(--ink); padding: 10px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: -30px 0 -24px; }
.bar button { font: 600 .78rem ui-monospace, monospace; color: var(--muted); background: var(--bench); border: 1px solid var(--edge); padding: 7px 12px; border-radius: 999px; cursor: pointer; }
.bar button[aria-pressed="true"] { color: var(--ink); background: var(--fg); border-color: var(--fg); }
.bar .stat { margin-left: auto; font: .78rem ui-monospace, monospace; color: var(--muted); }
section.tier { display: grid; gap: 16px; }
.thead { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: start; padding-bottom: 14px; border-bottom: 1px solid var(--edge); }
.tnum { font: 800 3.4rem/.9 ui-monospace, monospace; color: var(--c); grid-row: span 2; }
.thead h2 { margin: 0; font-size: clamp(1.3rem, 3.2vw, 2rem); }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 6px 18px; margin: 4px 0 0; font-size: .86rem; color: var(--muted); }
.rules div b { display: block; font: 600 .66rem ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.card { background: var(--bench); border: 1px solid var(--edge); border-radius: 10px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.card.lead { grid-column: span 2; }
.stage { position: relative; aspect-ratio: 4 / 3; background: #07060b; touch-action: none; }
.card.lead .stage { aspect-ratio: 16 / 9; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.meta { padding: 10px 12px 12px; display: grid; gap: 4px; align-content: start; }
.mrow { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.meta h3 { margin: 0; font-size: 1.02rem; }
.meta p { margin: 0; color: var(--muted); font-size: .85rem; }
.tag { font: 600 .66rem ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
.use { font: 600 .66rem ui-monospace, monospace; color: var(--fg); opacity: .75; }
@media (max-width: 760px) { .card.lead { grid-column: auto; } .card.lead .stage { aspect-ratio: 4 / 3; } .ladder { grid-template-columns: repeat(3, 1fr); } .bar .stat { margin-left: 0; } }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Effects Hierarchy</h1>
  <p>48 live effects plus an SDF raymarcher, sorted by how loud they are on screen. Tier 1 owns the screen for a beat; tier 6 runs quietly underneath and makes content. Each section states its budget from <code>HIERARCHY.md</code>. Tap or drag any tile. Tiles only render while visible.</p>
  <nav class="ladder" id="ladder" aria-label="Tiers"></nav>
</header>
<div class="bar" role="group" aria-label="Render quality">
  <button type="button" data-q="ultra" aria-pressed="true">Ultra (native res)</button>
  <button type="button" data-q="high" aria-pressed="false">High (1.5×)</button>
  <button type="button" data-q="phone" aria-pressed="false">Phone (1×)</button>
  <span class="stat" id="stat"></span>
</div>
<div id="tiers" style="display:grid;gap:56px;width:100%;min-width:0"></div>
</div>
<script>
"use strict";
const QUALITY = { mode: "ultra", scale() { const d = devicePixelRatio || 1; return this.mode === "ultra" ? Math.min(3, Math.max(1, d)) : this.mode === "high" ? Math.min(1.5, d) : 1; } };
const DEMOS = [];
function D(id, name, cat, note, run) { DEMOS.push({ id, name, cat, note, run }); }
function SH(id, name, note, frag) { DEMOS.push({ id, name, cat: "Shader", note, frag, run: function (g, W, H, t, dt, S, P) { GL.draw(g, W, H, t, P, frag); } }); }

/* ========================= MATERIALS ========================= */

D("brushed", "Brushed Metal", "Materials", "Streak texture plus an anisotropic highlight that follows your finger.",
function (g, W, H, t, dt, S, P) {
  if (!S.tex) {
    S.tex = document.createElement("canvas"); S.tex.width = 512; S.tex.height = 256;
    const x = S.tex.getContext("2d");
    const grd = x.createLinearGradient(0, 0, 0, 256);
    grd.addColorStop(0, "#8d939c"); grd.addColorStop(.5, "#c3c8cf"); grd.addColorStop(1, "#6f747c");
    x.fillStyle = grd; x.fillRect(0, 0, 512, 256);
    for (let i = 0; i < 6000; i++) {
      const y = Math.random() * 256, l = 30 + Math.random() * 260;
      x.fillStyle = Math.random() < .5 ? `rgba(255,255,255,${Math.random() * .12})` : `rgba(0,0,0,${Math.random() * .12})`;
      x.fillRect(Math.random() * 512 - 40, y, l, Math.random() < .8 ? .6 : 1.2);
    }
  }
  g.drawImage(S.tex, 0, 0, W, H);
  const hx = P.active ? P.x : W * (.5 + .4 * Math.sin(t * .8));
  g.save(); g.globalCompositeOperation = "lighter";
  g.translate(hx, H / 2); g.scale(.18, 1.6);
  const r = g.createRadialGradient(0, 0, 0, 0, 0, H * .6);
  r.addColorStop(0, "rgba(255,250,240,.55)"); r.addColorStop(.4, "rgba(200,220,255,.18)"); r.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = r; g.fillRect(-H, -H, H * 2, H * 2); g.restore();
  for (const [cx, cy] of [[24, 24], [W - 24, 24], [24, H - 24], [W - 24, H - 24]]) {
    const rv = g.createRadialGradient(cx - 3, cy - 3, 1, cx, cy, 9);
    rv.addColorStop(0, "#fff"); rv.addColorStop(.5, "#9aa0a8"); rv.addColorStop(1, "#3a3d42");
    g.fillStyle = rv; g.beginPath(); g.arc(cx, cy, 8, 0, 7); g.fill();
  }
});

D("glass", "Liquid Glass Lens", "Materials", "Per-pixel refraction with chromatic split and a Fresnel rim. Drag the lens.",
function (g, W, H, t, dt, S, P) {
  const w = 260, h = Math.round(260 * H / W);
  if (!S.o || S.h !== h) { S.o = document.createElement("canvas"); S.o.width = w; S.o.height = h; S.h = h; S.c = S.o.getContext("2d"); S.img = S.c.createImageData(w, h); }
  const d = S.img.data, k = w / W;
  const cx = (P.active ? P.x : W * (.5 + .3 * Math.cos(t * .7))) * k, cy = (P.active ? P.y : H * (.5 + .25 * Math.sin(t * 1.1))) * k, R = h * .34;
  const bg = (x, y, ch) => {
    const s = ((Math.floor(x / 10) + Math.floor(y / 10)) & 1) ? 1 : 0;
    const band = .5 + .5 * Math.sin((x + y) * .09 + t);
    return ch === 0 ? 40 + s * 120 * band + 60 : ch === 1 ? 30 + s * 90 + 40 * band : 90 + s * 140 * (1 - band) + 30;
  };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4, dx = (x - cx) / R, dy = (y - cy) / R, r2 = dx * dx + dy * dy;
    if (r2 < 1) {
      const nz = Math.sqrt(1 - r2), bend = (1 - nz) * 22, fres = Math.pow(1 - nz, 3);
      for (let ch = 0; ch < 3; ch++) {
        const s = bend * (1 + ch * .08);
        d[i + ch] = Math.min(255, bg(x - dx * s, y - dy * s, ch) * (.85 + .2 * nz) + fres * 230 + (dx < -.3 && dy < -.3 ? 40 * nz : 0));
      }
    } else { d[i] = bg(x, y, 0) * .8; d[i + 1] = bg(x, y, 1) * .8; d[i + 2] = bg(x, y, 2) * .8; }
    d[i + 3] = 255;
  }
  S.c.putImageData(S.img, 0, 0); g.imageSmoothingEnabled = true; g.drawImage(S.o, 0, 0, W, H);
});

D("gem", "Faceted Gem", "Materials", "A brilliant cut whose facets light up as it turns, with star glints.",
function (g, W, H, t, dt, S, P) {
  g.fillStyle = "#0b0912"; g.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, R = Math.min(W, H) * .36, n = 8, rot = t * .6, L = P.active ? Math.atan2(P.y - cy, P.x - cx) : t * 1.3;
  const shade = (a, base) => { const v = .5 + .5 * Math.cos(a - L); return `hsl(${190 + 40 * v},90%,${base + 45 * Math.pow(v, 3)}%)`; };
  const pt = (r, a) => [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  for (let i = 0; i < n * 2; i++) {
    const a0 = rot + i * Math.PI / n, a1 = rot + (i + 1) * Math.PI / n, am = (a0 + a1) / 2;
    const p = [pt(R, a0), pt(R, a1), pt(R * .55, am)];
    g.fillStyle = shade(am * 2, 18); g.beginPath(); g.moveTo(...p[0]); g.lineTo(...p[1]); g.lineTo(...p[2]); g.fill();
    const q = [pt(R * .55, am), pt(R * .55, am + Math.PI / n), pt(R, a1)];
    g.fillStyle = shade(am * 3 + 1, 12); g.beginPath(); g.moveTo(...q[0]); g.lineTo(...q[1]); g.lineTo(...q[2]); g.fill();
  }
  g.fillStyle = shade(rot * 2, 25); g.beginPath();
  for (let i = 0; i < n; i++) g.lineTo(...pt(R * .55, rot + (i + .5) * 2 * Math.PI / n)); g.fill();
  g.strokeStyle = "rgba(255,255,255,.25)"; g.lineWidth = 1; g.stroke();
  g.globalCompositeOperation = "lighter";
  for (let i = 0; i < 3; i++) {
    const ph = (t * .7 + i / 3) % 1, a = rot + i * 2.1, [sx, sy] = pt(R * (.3 + .5 * ((i * .37) % 1)), a), s = Math.sin(ph * Math.PI) * 18;
    g.strokeStyle = "rgba(255,255,255,.9)"; g.lineWidth = 1.5; g.beginPath();
    g.moveTo(sx - s, sy); g.lineTo(sx + s, sy); g.moveTo(sx, sy - s); g.lineTo(sx, sy + s); g.stroke();
  }
  g.globalCompositeOperation = "source-over";
});

D("molten", "Molten Core", "Materials", "Plasma noise through a black-body heat ramp, with a cooling crust.",
function (g, W, H, t, dt, S, P) {
  const w = 220, h = Math.round(220 * H / W);
  if (!S.o || S.h !== h) { S.o = document.createElement("canvas"); S.o.width = w; S.o.height = h; S.h = h; S.c = S.o.getContext("2d"); S.img = S.c.createImageData(w, h); }
  const d = S.img.data;
  const ramp = v => { v = Math.max(0, Math.min(1, v)); return [255 * Math.min(1, v * 2.2), 255 * Math.max(0, Math.min(1, v * 2 - .5)), 255 * Math.max(0, v * 3 - 2)]; };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let v = Math.sin(x * .09 + t) + Math.sin(y * .11 - t * 1.3) + Math.sin((x + y) * .06 + t * .7) + Math.sin(Math.hypot(x - w / 2, y - h / 2) * .15 - t * 2);
    v = (v + 4) / 8;
    const crack = Math.abs(Math.sin(x * .21 + Math.sin(y * .13 + t * .3) * 2)) * Math.abs(Math.sin(y * .19 + Math.cos(x * .1) * 2));
    const heat = crack < .12 ? .55 + v * .5 : v * .45 * (1 - crack * .6);
    const c = ramp(heat), i = (y * w + x) * 4;
    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
  }
  S.c.putImageData(S.img, 0, 0); g.imageSmoothingEnabled = true; g.drawImage(S.o, 0, 0, W, H);
});

D("holo", "Holographic Foil", "Materials", "A trading-card foil: rainbow shifts with tilt, a sheen band sweeps across.",
function (g, W, H, t, dt, S, P) {
  g.fillStyle = "#0c0a12"; g.fillRect(0, 0, W, H);
  const cw = Math.min(W * .56, H * .62), ch = cw * 1.4 > H * .88 ? H * .88 : cw * 1.4, x0 = (W - cw) / 2, y0 = (H - ch) / 2;
  const tx = P.active ? (P.x / W - .5) * 2 : Math.sin(t * .9), ty = P.active ? (P.y / H - .5) * 2 : Math.cos(t * .6) * .5;
  const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); };
  g.save(); rr(x0, y0, cw, ch, 12); g.clip();
  const lg = g.createLinearGradient(x0, y0, x0 + cw, y0 + ch);
  for (let i = 0; i <= 6; i++) lg.addColorStop(i / 6, `hsl(${(i * 60 + tx * 120 + ty * 60 + 360) % 360},85%,62%)`);
  g.fillStyle = lg; g.fillRect(x0, y0, cw, ch);
  g.globalCompositeOperation = "overlay";
  for (let i = -20; i < 40; i++) { g.fillStyle = i % 2 ? "rgba(255,255,255,.18)" : "rgba(0,0,0,.18)"; g.fillRect(x0 + i * 8 + tx * 10, y0, 4, ch); }
  g.globalCompositeOperation = "lighter";
  const sx = x0 + cw * (.5 + tx * .7);
  const sh = g.createLinearGradient(sx - 50, y0, sx + 50, y0 + ch * .2);
  sh.addColorStop(0, "rgba(255,255,255,0)"); sh.addColorStop(.5, "rgba(255,255,255,.55)"); sh.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = sh; g.fillRect(x0, y0, cw, ch);
  g.globalCompositeOperation = "source-over";
  g.fillStyle = "rgba(10,8,20,.55)"; rr(x0 + 14, y0 + 14, cw - 28, ch * .55, 8); g.fill();
  g.fillStyle = "#fff"; g.font = `700 ${cw * .09}px Space Grotesk, sans-serif`; g.textAlign = "center";
  g.fillText("FOIL ✦ 07", x0 + cw / 2, y0 + ch * .78);
  g.restore();
  g.strokeStyle = "rgba(255,255,255,.6)"; g.lineWidth = 2; rr(x0, y0, cw, ch, 12); g.stroke();
});

/* ========================= VFX ========================= */

D("dissolve", "Ember Dissolve", "VFX", "Noise-threshold burn-away with a glowing ember edge.",
function (g, W, H, t, dt, S, P) {
  const w = 240, h = Math.round(240 * H / W);
  if (!S.o || S.h !== h) {
    S.o = document.createElement("canvas"); S.o.width = w; S.o.height = h; S.h = h; S.c = S.o.getContext("2d"); S.img = S.c.createImageData(w, h);
    const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
    const vn = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      return (hash(xi, yi) * (1 - u) + hash(xi + 1, yi) * u) * (1 - v) + (hash(xi, yi + 1) * (1 - u) + hash(xi + 1, yi + 1) * u) * v; };
    S.n = new Float32Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) S.n[y * w + x] = vn(x / 14, y / 14) * .6 + vn(x / 5, y / 5) * .3 + vn(x / 2, y / 2) * .1;
  }
  const d = S.img.data, ph = (t % 4) / 3.2, th = Math.min(1.05, ph) * 1.1 - .05;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4, n = S.n[y * w + x], dx = x - w / 2, dy = y - h / 2, inside = Math.abs(dx) + Math.abs(dy) * 1.2 < h * .42;
    if (!inside || n < th) { d[i] = 12; d[i + 1] = 10; d[i + 2] = 18; }
    else if (n < th + .05) { const e = 1 - (n - th) / .05; d[i] = 255; d[i + 1] = 120 + 135 * e; d[i + 2] = 40 * e; }
    else { const s = ((x >> 3) + (y >> 3)) & 1; d[i] = 70 + s * 30; d[i + 1] = 110 + s * 30; d[i + 2] = 200; }
    d[i + 3] = 255;
  }
  S.c.putImageData(S.img, 0, 0); g.imageSmoothingEnabled = false; g.drawImage(S.o, 0, 0, W, H);
});

D("whip", "Verlet Whip", "VFX", "A rope of Verlet points cracked from a moving hand, with ghost trails.",
function (g, W, H, t, dt, S, P) {
  const N = 26, seg = Math.min(W, H) * .028;
  if (!S.p) { S.p = []; for (let i = 0; i < N; i++) S.p.push({ x: W / 2 + i * seg, y: H / 2, ox: W / 2 + i * seg, oy: H / 2 }); S.trail = []; }
  g.fillStyle = "rgba(10,9,16,.35)"; g.fillRect(0, 0, W, H);
  const a = Math.sin(t * 5) * 1.6 + (P.active ? Math.atan2(P.y - H / 2, P.x - W / 2) : 0);
  const p = S.p; p[0].x = W / 2 + Math.cos(a) * seg * 2; p[0].y = H / 2 + Math.sin(a) * seg * 2;
  for (let i = 1; i < N; i++) { const q = p[i], vx = (q.x - q.ox) * .97, vy = (q.y - q.oy) * .97; q.ox = q.x; q.oy = q.y; q.x += vx; q.y += vy; }
  for (let k = 0; k < 10; k++) for (let i = 1; i < N; i++) {
    const A = p[i - 1], B = p[i], dx = B.x - A.x, dy = B.y - A.y, dd = Math.hypot(dx, dy) || 1, f = (dd - seg) / dd;
    if (i > 1) { A.x += dx * f * .5; A.y += dy * f * .5; B.x -= dx * f * .5; B.y -= dy * f * .5; } else { B.x -= dx * f; B.y -= dy * f; }
  }
  S.trail.push(p.map(q => [q.x, q.y])); if (S.trail.length > 8) S.trail.shift();
  S.trail.forEach((tr, j) => { g.strokeStyle = `rgba(255,170,80,${j / 40})`; g.lineWidth = 2; g.beginPath(); tr.forEach(([x, y]) => g.lineTo(x, y)); g.stroke(); });
  for (let i = 1; i < N; i++) { g.strokeStyle = `hsl(${30 + i * 2},90%,${50 + i}%)`; g.lineWidth = 7 * (1 - i / N) + 1; g.lineCap = "round"; g.beginPath(); g.moveTo(p[i - 1].x, p[i - 1].y); g.lineTo(p[i].x, p[i].y); g.stroke(); }
  g.fillStyle = "#ffe3b0"; g.beginPath(); g.arc(W / 2, H / 2, 10, 0, 7); g.fill();
});

D("lightning", "Branching Lightning", "VFX", "Midpoint-displacement bolts with forks, glow and a screen flash. Tap to strike.",
function (g, W, H, t, dt, S, P) {
  const make = (x1, y1, x2, y2, dep, out) => {
    if (dep === 0) { out.push([x1, y1, x2, y2]); return; }
    const mx = (x1 + x2) / 2 + (Math.random() - .5) * Math.hypot(x2 - x1, y2 - y1) * .35, my = (y1 + y2) / 2 + (Math.random() - .5) * 10;
    make(x1, y1, mx, my, dep - 1, out); make(mx, my, x2, y2, dep - 1, out);
    if (Math.random() < .18 * dep / 5) make(mx, my, mx + (Math.random() - .5) * W * .4, my + H * .25, dep - 2 > 0 ? dep - 2 : 0, out);
  };
  S.next ??= 0;
  if (t > S.next || P.tap) { S.bolt = []; const x = P.tap ? P.x : W * (.2 + Math.random() * .6); make(W * (.3 + Math.random() * .4), 0, x, H * .95, 7, S.bolt); S.flash = 1; S.next = t + .6 + Math.random() * .9; }
  S.flash = Math.max(0, (S.flash || 0) - dt * 1.6);
  g.fillStyle = `rgba(${12 + S.flash * 90},${12 + S.flash * 100},${24 + S.flash * 140},.6)`; g.fillRect(0, 0, W, H);
  if (S.bolt && S.flash > 0) {
    g.lineCap = "round"; g.globalCompositeOperation = "lighter";
    for (const [w, c] of [[12, `rgba(90,160,255,${.15 * S.flash})`], [5, `rgba(150,200,255,${.5 * S.flash})`], [1.6, `rgba(255,255,255,${S.flash})`]]) {
      g.strokeStyle = c; g.lineWidth = w; g.beginPath(); for (const [a, b, c2, d2] of S.bolt) { g.moveTo(a, b); g.lineTo(c2, d2); } g.stroke();
    }
    g.globalCompositeOperation = "source-over";
  }
});

D("aura", "Automaton Aura", "VFX", "A polar cellular automaton ring that breathes around a center.",
function (g, W, H, t, dt, S, P) {
  const R = 7, C = 56;

void main(){ vec2 uv = (gl_FragCoord.xy - .5 * R) / R.y; float yaw = M.z > .5 ? (M.x / R.x - .5) * 4. : T * .2;
  vec3 ro = vec3(3. * sin(yaw), .9, 3. * cos(yaw)), ta = vec3(0., -.2, 0.), f = normalize(ta - ro), r = normalize(cross(vec3(0., 1., 0.), f)), u = cross(f, r);
  vec3 rd = normalize(uv.x * r + uv.y * u + 1.6 * f); float t = 0.; bool hit = false;
  for (int i = 0; i < 128; i++) { float d = map(ro + rd * t); if (d < .0005) { hit = true; break; } t += d; if (t > 12.) break; }
  vec3 col = mix(vec3(.05, .04, .09), vec3(.12, .1, .2), uv.y + .5);
  if (hit) { vec3 p = ro + rd * t, n = nrm(p), L = normalize(vec3(.6, .8, .4)); float dif = max(dot(n, L), 0.) * shadow(p + n * .002, L);
    float rim = pow(1. - max(dot(n, -rd), 0.), 3.), spec = pow(max(dot(reflect(-L, n), -rd), 0.), 48.);
    vec3 alb = p.y < -.99 ? vec3(.18, .16, .24) : vec3(1., .71, .28);
    col = alb * (.15 + .85 * dif) * ao(p, n) + rim * vec3(.43, .84, 1.) * .6 + spec * dif;
    col = mix(col, vec3(.05, .04, .09), 1. - exp(-.02 * t * t)); }
  gl_FragColor = vec4(pow(col, vec3(.4545)), 1.); }`);

/* ---- the hierarchy ---- */
const TIERS = [
  { n: 1, name: "Moments & Rewards", loud: 5, c: "--t1", owner: "ceremony (7)", rungs: "ceremony (3), boss (4), finale (5)",
    budget: "Owns the screen for a beat. One at a time, skippable, world dims to the lowest band.",
    ids: ["gacha", "portal", "roulette", "chest", "cardflip", "countup", "rebirth", "xpbar", "textmorph", "blackhole"] },
  { n: 2, name: "Combat & Impact", loud: 4, c: "--t2", owner: "hero (5) / threat (4)", rungs: "all; impact frames from surge (2)",
    budget: "Reads instantly, gets out of the way: brightest on the onset frame, baseline within 12 frames, ≤ 6 decorations at once.",
    ids: ["lightning", "shockwave", "whip", "shatter", "dissolve", "vortex", "plasma", "aura", "freeze", "glyphrain"] },
  { n: 3, name: "HUD & Interface", loud: 3, c: "--t3", owner: "UI (6)", rungs: "all; ornament waits at surge, boss, finale",
    budget: "Always on screen, so still until a number changes. One loud element per panel. Gold = currency, blue = XP, red = danger.",
    ids: ["odometer", "frames", "dmgnums", "combo", "cooldown", "feed", "luck", "lowhp"] },
  { n: 4, name: "World & Atmosphere", loud: 2, c: "--t4", owner: "ambient (1) / world (2)", rungs: "calm (0), build (1), ceremony (3); off in surge, boss, finale",
    budget: "Slow, soft, never brighter than the HUD. Steps back first when the screen gets busy.",
    ids: ["aurora", "godrays", "fireflies", "snow", "cloth", "ink"] },
  { n: 5, name: "Materials", loud: 2, c: "--t5", owner: "inherits the surface it's on", rungs: "all; motion only from Rare up",
    budget: "One material per rarity, used consistently: flat → satin → brushed → glass/gem → chrome/molten → holo → void.",
    ids: ["holo", "crystal", "chrome", "gem", "glass", "soap", "molten", "brushed"] },
  { n: 6, name: "Generative Engines", loud: 1, c: "--t6", owner: "background (0) until it feeds a louder tier", rungs: "all; slows or freezes at calm",
    budget: "Systems that make content: patterns, growth, crowds and text rendering. They never compete for attention themselves.",
    ids: ["sdf", "reaction", "voronoi", "flow", "boids", "tree", "ascii"] }
];
const USE = {
  roulette: "Crate / egg opening", gacha: "Summon, hatch, pull", portal: "Mythic reveal backdrop", countup: "Rarity roll, sell value", cardflip: "Card or pet reveal", chest: "Chest open", rebirth: "Rebirth / prestige", xpbar: "Level-up", textmorph: "Banners, announcements", blackhole: "Boss intro, void zone",
  lightning: "Chain lightning", whip: "Melee swing trail", shockwave: "Nuke / screen clear", shatter: "Break, shield pop", dissolve: "Death, despawn", vortex: "Magnet, collect", plasma: "Charge-up, energy item", aura: "Passive aura", freeze: "Time stop", glyphrain: "Digital zone",
  frames: "Inventory slots", odometer: "Coins, big numbers", combo: "Hit streaks", feed: "Loot log", luck: "Luck / boost meter", dmgnums: "Damage numbers", lowhp: "Danger state", cooldown: "Ability bar",
  aurora: "Night sky, winter map", godrays: "Forest, temple", snow: "Winter maps", cloth: "Flags, banners, capes", fireflies: "Night ambience", ink: "Loading screen",
  crystal: "Gem items", chrome: "Premium items", soap: "Bubble pets, shields", holo: "Foil cards, shiny variants", gem: "Currency icon", glass: "Potion, lens UI", molten: "Lava zone, forge", brushed: "Metal UI panels",
  sdf: "Soft shapes, panels, blobs", reaction: "Coral, corruption spread", tree: "Growth upgrades", voronoi: "Stained glass, cracks", ascii: "Retro mode, crowd LOD", boids: "Fish, bird swarms", flow: "Backgrounds"
};

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const QS = new URLSearchParams(location.search);
const ALL = QS.has("all"); // test mode: run every tile, visible or not
const ONLY = QS.get("only"); // capture mode: run just this effect id
const host = document.getElementById("tiers"), ladder = document.getElementById("ladder");
const tiles = [];
function pointer(cv) {
  const P = { x: 0, y: 0, active: false, tap: false };
  const at = e => { const r = cv.getBoundingClientRect(); P.x = e.clientX - r.left; P.y = e.clientY - r.top; };
  cv.addEventListener("pointerdown", e => { at(e); P.active = true; P.tap = true; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", at);
  cv.addEventListener("pointerup", () => { P.active = false; });
  cv.addEventListener("pointercancel", () => { P.active = false; });
  return P;
}
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
for (const T of TIERS) {
  const a = el("a"); a.href = "#tier-" + T.n; a.style.setProperty("--c", `var(${T.c})`); a.style.setProperty("--w", (T.loud * 20) + "%");
  a.append(el("b", null, String(T.n)), el("span", null, T.name), el("div", "meter")); ladder.append(a);
  const sec = el("section", "tier"); sec.id = "tier-" + T.n; sec.style.setProperty("--c", `var(${T.c})`);
  const head = el("div", "thead"); head.append(el("div", "tnum", String(T.n)));
  const info = el("div"); info.append(el("h2", null, T.name));
  const rules = el("div", "rules");
  for (const [k, v] of [["Loudness", "■".repeat(T.loud) + "□".repeat(5 - T.loud)], ["Budget", T.budget], ["Pixel owner", T.owner], ["Intensity rungs", T.rungs]]) {
    const d = el("div"); d.append(el("b", null, k), document.createTextNode(v)); rules.append(d);
  }
  info.append(rules); head.append(info); sec.append(head);
  const grid = el("div", "grid"); sec.append(grid); host.append(sec);
  T.ids.forEach((id, i) => {
    const d = DEMOS.find(x => x.id === id); if (!d) { console.warn("missing demo", id); return; }
    const card = el("article", "card" + (i === 0 ? " lead" : ""));
    const stage = el("div", "stage"), cv = el("canvas"); cv.setAttribute("role", "img"); cv.setAttribute("aria-label", d.name);
    stage.append(cv);
    const meta = el("div", "meta"), row = el("div", "mrow");
    row.append(el("span", "tag", d.frag ? "GPU shader" : "Canvas 2D"), el("span", "use", USE[id] || ""));
    meta.append(row, el("h3", null, d.name), el("p", null, d.note));
    card.append(stage, meta); grid.append(card);
    cv.dataset.id = id;
    tiles.push({ d, cv, g: cv.getContext("2d"), S: {}, P: pointer(cv), visible: ONLY ? id === ONLY : ALL });
  });
}
const io = new IntersectionObserver(es => { for (const e of es) { const tl = tiles.find(x => x.cv === e.target); if (tl && !ALL && !ONLY) tl.visible = e.isIntersecting; } }, { rootMargin: "120px" });
tiles.forEach(tl => io.observe(tl.cv));
document.querySelectorAll(".bar button").forEach(b => b.addEventListener("click", () => {
  QUALITY.mode = b.dataset.q; document.querySelectorAll(".bar button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
}));

const stat = document.getElementById("stat");
let last = performance.now(), acc = 0, frames = 0;
function fit(tl) {
  const sc = QUALITY.scale(), r = tl.cv.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width * sc)), h = Math.max(1, Math.round(r.height * sc));
  if (tl.cv.width !== w || tl.cv.height !== h) { tl.cv.width = w; tl.cv.height = h; }
  tl.g.setTransform(sc, 0, 0, sc, 0, 0); tl.g.imageSmoothingQuality = "high";
  return [r.width, r.height];
}
function frame(now) {
  const raw = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  const dt = raw * (reduce ? 0.35 : 1), t = now / 1000 * (reduce ? 0.35 : 1);
  let live = 0;
  for (const tl of tiles) {
    if (!tl.visible) continue; live++;
    const [W, H] = fit(tl);
    try { tl.d.run(tl.g, W, H, t, dt, tl.S, tl.P); } catch (e) { console.error(tl.d.id, e); tl.visible = false; }
    tl.P.tap = false;
  }
  acc += raw; frames++;
  if (acc > 0.5) { stat.textContent = `${Math.round(frames / acc)} fps · ${live} live · ${QUALITY.scale().toFixed(2)}× render scale`; acc = 0; frames = 0; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
